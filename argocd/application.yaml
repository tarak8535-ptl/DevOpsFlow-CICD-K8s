apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devopsflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tarak8535-ptl/DevOpsFlow-CICD-K8s.git
    targetRevision: v1.1.0-security-fix
    path: helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
