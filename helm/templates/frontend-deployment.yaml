apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-flow-frontend
  namespace: devops
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: devops-flow-frontend
  template:
    metadata:
      labels:
        app: devops-flow-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- include "devopsflow.resources" . | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
