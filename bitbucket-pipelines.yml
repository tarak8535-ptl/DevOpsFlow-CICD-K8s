image: atlassian/default-image:3

definitions:
  caches:
    npm: ~/.npm
  steps:
    # ── Test steps ──────────────────────────────────────────
    - step: &auth-test
        name: Auth Service Test
        caches:
          - npm
        script:
          - cd services/auth
          - npm ci
          - npm run lint
          - npm test

    - step: &dashboard-test
        name: Dashboard Service Test
        caches:
          - npm
        script:
          - cd services/dashboard
          - npm ci
          - npm run lint
          - npm test

    - step: &logs-test
        name: Logs Service Test
        caches:
          - npm
        script:
          - cd services/logs
          - npm ci
          - npm run lint
          - npm test

    - step: &monitoring-test
        name: Monitoring Service Test
        caches:
          - npm
        script:
          - cd services/monitoring
          - npm ci
          - npm run lint
          - npm test

    - step: &frontend-test
        name: Frontend Test
        caches:
          - npm
        script:
          - cd frontend
          - npm ci
          - npm run lint
          - npm test

    # ── Security scan ───────────────────────────────────────
    - step: &security-scan
        name: Security Scan (all services)
        script:
          - pipe: aquasecurity/trivy-pipe:1.0.0
            variables:
              SCAN_TYPE: 'fs'
              SCAN_REF: '.'
              EXIT_CODE: '1'
              SEVERITY: 'HIGH,CRITICAL'
        allow_failure: true

    # ── Build steps ─────────────────────────────────────────
    - step: &build-services
        name: Build & Push All Images
        services:
          - docker
        script:
          - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
          - TAG=${BITBUCKET_BRANCH//\//_}
          - |
            for svc in auth dashboard logs monitoring; do
              IMAGE=$BITBUCKET_REPO_SLUG/$svc:$TAG
              docker build -t $IMAGE ./services/$svc
              docker push $IMAGE
            done
          - FRONTEND_IMAGE=$BITBUCKET_REPO_SLUG/frontend:$TAG
          - docker build -t $FRONTEND_IMAGE ./frontend
          - docker push $FRONTEND_IMAGE

    # ── Deploy steps ────────────────────────────────────────
    - step: &deploy-staging
        name: Deploy to Staging
        deployment: staging
        script:
          - pipe: atlassian/kubectl-run:2.0.0
            variables:
              KUBE_CONFIG: $KUBE_CONFIG_STAGING
              KUBECTL_COMMAND: 'apply'
              RESOURCE_PATH: 'k8s/'

    - step: &deploy-production
        name: Deploy to Production
        deployment: production
        trigger: manual
        script:
          - curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          - chmod +x argocd
          - ./argocd login $ARGOCD_SERVER --username $ARGOCD_USERNAME --password $ARGOCD_PASSWORD --insecure
          - ./argocd app sync devopsflow
          - ./argocd app wait devopsflow

pipelines:
  branches:
    main:
      - parallel:
          - step: *auth-test
          - step: *dashboard-test
          - step: *logs-test
          - step: *monitoring-test
          - step: *frontend-test
      - step: *security-scan
      - step: *build-services
      - step: *deploy-production
    staging:
      - parallel:
          - step: *auth-test
          - step: *dashboard-test
          - step: *logs-test
          - step: *monitoring-test
          - step: *frontend-test
      - step: *security-scan
      - step: *build-services
      - step: *deploy-staging
  pull-requests:
    '**':
      - parallel:
          - step: *auth-test
          - step: *dashboard-test
          - step: *logs-test
          - step: *monitoring-test
          - step: *frontend-test
      - step: *security-scan
